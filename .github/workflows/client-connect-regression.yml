# 接続失敗時のイベントループ解放を、Linux と Windows の実 TCP で毎日検証する。
# 鍵生成を含むため PR の必須 CI では実行しない（banto-opcua #3）。

name: Client connection regression

on:
  workflow_dispatch:
  schedule:
    - cron: "41 18 * * *"

jobs:
  connect:
    name: Client connect timeout and cancellation
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Test connect timeout and cancellation
        run: cargo test -p banto-opcua-server --test client_connect_failure -- --ignored --nocapture
