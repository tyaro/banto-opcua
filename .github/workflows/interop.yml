# 外部実装との相互接続。
#
# PR の必須 CI（ci.yml）には入れない。プロセス内テストは ci.yml の cargo test。
# ここは次の相手を想定した別ワークフローで、中身はまだプレースホルダ。
#
#   - 本リポジトリのサーバーに対する Python asyncua クライアント
#   - 本リポジトリのクライアントに対する mcr.microsoft.com/iotedge/opc-plc（Linux）
#
# 起動: 手動、毎日、main への push。PR は下の paths に当たったときだけ。

name: Interop

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"
  push:
    branches: [main]
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - ".github/workflows/interop.yml"
      - "interop/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external:
    name: External interop (placeholder)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

