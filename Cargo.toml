# banto ファミリーの汎用 OPC UA ライブラリ（サーバーとクライアント）。
# 最初の利用者は tyaro/banto-industrial の banto-hub（issue #201、読み取り専用サーバー）。
# プロトコル実装の採否は docs/adr/0001-async-opcua-base.md。
# 配布は banto ADR-0011 に合わせ git タグを予定し、crates.io 公開は未決
# （publish = false）。
[workspace]
resolver = "2"
members = [
    "crates/banto-opcua-core",
    "crates/banto-opcua-server",
    "crates/banto-opcua-client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/tyaro/banto-opcua"
rust-version = "1.98.1"

[workspace.dependencies]
banto-opcua-core = { path = "crates/banto-opcua-core" }
# ADR-0001。default-features は空で、server / client は各クレートが必要な
# feature だけを有効にする（両方を core へ入れない）。
async-opcua = { version = "0.19", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
# サンプル鍵の置き場。Phase 3 の証明書ディレクトリに置き換えるまでの足場。
tempfile = "3"
tracing = { version = "0.1", default-features = false, features = ["std"] }
