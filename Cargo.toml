# banto ファミリーの汎用 OPC UA ライブラリ（サーバーとクライアント）。
# 最初の利用者は tyaro/banto-industrial の banto-hub（issue #201、読み取り専用サーバー）。
# プロトコル実装の採否は docs/adr/0001-async-opcua-base.md。
# 配布は banto ADR-0011 に合わせ git タグを予定し、crates.io 公開は未決
# （publish = false）。
[workspace]
resolver = "2"
members = [
    "crates/banto-opcua-core",
    "crates/banto-opcua-pki",
    "crates/banto-opcua-server",
    "crates/banto-opcua-client",
]

[workspace.package]
version = "0.3.4"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/tyaro/banto-opcua"
rust-version = "1.98.1"

[workspace.dependencies]
banto-opcua-core = { path = "crates/banto-opcua-core" }
banto-opcua-pki = { path = "crates/banto-opcua-pki" }
# ADR-0001。default-features は空で、server / client は各クレートが必要な
# feature だけを有効にする（両方を core へ入れない）。
# 0.19.0 未収録の品質変更通知修正（upstream #274）、採取時刻保持修正（fork PR #1）、
# 接続終了時のサービス中止（fork PR #2、ADR-0004）、証明書の保存名を拇印だけにし
# IPv6 のホスト名を照合する修正（fork の fix/thumbprint-cert-file-names、ADR-0009）。
# #17: これらを含む公開版が出たら crates.io に戻す。
async-opcua = { git = "https://github.com/tyaro/async-opcua", rev = "a08a53a1ef00b68bcde44625d5b9cd53cc4010d0", default-features = false }
# クライアントのイベントループのストリームを回す。async-opcua が既に引いている。
futures-util = { version = "0.3", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
# サンプル鍵の置き場。Phase 3 の証明書ディレクトリに置き換えるまでの足場。
tempfile = "3"
tracing = { version = "0.1", default-features = false, features = ["std"] }
