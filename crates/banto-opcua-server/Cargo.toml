# 読み取り専用 OPC UA サーバー。Phase 1 は固定タグの Browse / Read /
# Subscription まで。ハブのタグレジストリは Phase 2 で接続する。
[package]
name = "banto-opcua-server"
description = "banto OPC UA サーバー。既定の待受は 127.0.0.1、初期スコープは読み取り専用"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-opcua = { workspace = true, features = ["server"] }
banto-opcua-core = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
banto-opcua-client = { path = "../banto-opcua-client" }
tokio = { workspace = true, features = ["io-util"] }
