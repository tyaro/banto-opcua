# OPC UA サーバー。タグの Browse / Read / Subscription と、利用者の書き込み
# ハンドラーに通す Write（ADR-0004）。ハンドラーを渡さなければ読み取り専用。
[package]
name = "banto-opcua-server"
description = "banto OPC UA サーバー。既定の待受は 127.0.0.1、書き込みは利用者のハンドラーを通す"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-opcua = { workspace = true, features = ["server"] }
# async-opcua の InMemoryNodeManagerImpl を実装するため（ADR-0004）。依存木には既にある。
async-trait = "0.1"
banto-opcua-core = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
banto-opcua-client = { path = "../banto-opcua-client" }
tokio = { workspace = true, features = ["io-util", "sync"] }
